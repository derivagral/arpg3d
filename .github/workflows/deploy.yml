name: Deploy to GitHub Pages

# `actions/configure-pages` enables Pages and switches its source to GitHub
# Actions on the first run, so this workflow no longer needs a manual step in
# repo settings. Without it, the build succeeds and `deploy-pages` fails with a
# bare `Failed to create deployment (status: 404)` — the deployment endpoint
# does not exist until a Pages site does, and the 404 says nothing about that.
#
# If that step ever fails on permissions, the manual equivalent is
# Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a superseded
# run still finishes rather than leaving Pages on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on tests. A broken save codec reaching production
      # costs players their runs.
      - run: npm test

      # Enables Pages if it is not enabled yet, and reports where the site
      # will actually be served from.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # ── Resolve the deploy URL ────────────────────────────────────────────
      # This is not cosmetic. SITE_ORIGIN and SITE_BASE are baked into
      # client-metadata.json, and atproto authorization servers fetch that
      # document at the exact URL they were handed as client_id. A wrong
      # value does not degrade — it fails sign-in outright.
      #
      # The URL comes from the Pages API rather than being reconstructed from
      # the repository name, so a user site, a project site under /<repo>/ and
      # a custom domain are all handled without editing this file.
      #
      # It arrives through `env:` rather than ${{ }} interpolation inside the
      # script so that nothing from the API can be shell-injected, and is
      # parsed with the same URL semantics src/identity/clientMetadata.js uses.
      - name: Resolve site origin and base
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Pages did not report a base_url"; exit 1; }

          origin=$(node -p 'new URL(process.env.BASE_URL).origin')
          base=$(node -p 'const p = new URL(process.env.BASE_URL).pathname.replace(/\/+$/, ""); p ? p + "/" : "/"')

          echo "SITE_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # Fail loudly here rather than shipping a site whose sign-in is quietly
      # broken. The callback must exist as a real file (GitHub Pages has no
      # SPA rewrite), and client_id must equal the document's own URL.
      - name: Verify OAuth deploy artifacts
        run: |
          set -euo pipefail
          test -f dist/oauth/callback/index.html \
            || { echo "::error::dist/oauth/callback/index.html missing — redirect_uri would 404"; exit 1; }

          expected="${SITE_ORIGIN}${SITE_BASE}client-metadata.json"
          actual=$(node -p "require('./dist/client-metadata.json').client_id")
          [ "$actual" = "$expected" ] \
            || { echo "::error::client_id is '$actual', expected '$expected'"; exit 1; }

          redirect=$(node -p "require('./dist/client-metadata.json').redirect_uris[0]")
          echo "client_id:    $actual"
          echo "redirect_uri: $redirect"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

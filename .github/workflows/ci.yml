name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # sim/ and src/ are Node-importable by design — no browser, no Babylon.
      - run: npm test

      # A build failure is a real failure even when tests pass: the Vite
      # config generates client-metadata.json and resolves a second entry
      # point, and neither is exercised by the unit tests.
      - run: npm run build
